<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mushaf Acak</title>
<style>
  :root {
    --bg: #17251f;
    --bar: #101b16;
    --ink: #e9e4d3;
    --muted: #93a398;
    --accent: #d8b45a;
    --line: #2b3d34;
    --paper: #fbf8ef;
    --top-h: 38px;
    --bot-h: 54px;
    --zoom: 1;
    --ratio: 1.348; /* lebar spread / tinggi: 2 x 809/1200 */
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    height: 100dvh;
  }

  button, input {
    font: inherit;
    color: var(--ink);
    background: #223229;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 5px 12px;
  }
  button { cursor: pointer; }
  button:hover { background: #2b4033; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.on { border-color: var(--accent); color: var(--accent); }

  /* Bar atas: tipis, berisi fitur tambahan */
  .top {
    height: var(--top-h);
    flex: none;
    background: var(--bar);
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 12px;
    font-size: 13px;
  }
  .top button, .top input { padding: 3px 10px; font-size: 13px; }
  .top input { width: 70px; text-align: center; }
  .top .label { color: var(--muted); }
  .top .grow { flex: 1; }
  #info { color: var(--muted); }
  #info b { color: var(--ink); font-weight: 600; }

  /* Area baca: sebesar mungkin */
  main {
    flex: 1;
    min-height: 0;
    overflow: auto;
    display: flex;
    justify-content: safe center;
    align-items: safe center;
  }
  .book {
    display: flex;
    flex: none;
    direction: ltr;
    background: var(--paper);
  }
  .slot {
    position: relative;
    height: calc(min(100dvh - var(--top-h) - var(--bot-h), 100vw / var(--ratio)) * var(--zoom));
    aspect-ratio: 809 / 1200;
    background: var(--paper);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .book.single .slot {
    height: calc(min(100dvh - var(--top-h) - var(--bot-h), 100vw * 1.4833) * var(--zoom));
  }
  .slot img { height: 100%; width: 100%; display: block; }
  .slot.empty { background: #e9e3cf; }
  .slot.left::after, .slot.right::after {
    content: "";
    position: absolute; top: 0; bottom: 0; width: 5%;
    pointer-events: none;
  }
  .slot.left::after  { right: 0; background: linear-gradient(to left, rgba(60,40,10,.22), transparent); }
  .slot.right::after { left: 0;  background: linear-gradient(to right, rgba(60,40,10,.22), transparent); }
  .slot.empty::after, .book.single .slot::after { display: none; }
  .slot .err { padding: 24px; text-align: center; color: #5a4a2a; font-size: 14px; line-height: 1.5; }
  .slot .loading { color: #8a7a55; font-size: 14px; }

  /* Bar bawah: sebelumnya | acak | berikutnya, zoom di pojok kanan */
  .bottom {
    height: var(--bot-h);
    flex: none;
    background: var(--bar);
    border-top: 1px solid var(--line);
    position: relative;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
  }
  .bottom .cell { display: flex; justify-content: center; }
  .bottom .nav { min-width: 150px; padding: 8px 20px; font-size: 15px; }
  #random {
    background: var(--accent);
    color: #1b1608;
    border-color: var(--accent);
    font-weight: 700;
    font-size: 16px;
    padding: 8px 40px;
  }
  #random:hover { background: #e6c673; }
  .zoom {
    position: absolute;
    right: 12px; top: 50%;
    transform: translateY(-50%);
    display: flex; align-items: center; gap: 4px;
    font-size: 13px; color: var(--muted);
  }
  .zoom button { padding: 3px 10px; }
  #zval { min-width: 42px; text-align: center; }

  @media (max-width: 900px) {
    .bottom .nav { min-width: 0; padding: 8px 12px; }
    .zoom { display: none; }
  }
</style>
</head>
<body>

<div class="top">
  <span class="label">Ke halaman</span>
  <input id="goto" type="number" min="1" max="604" placeholder="1–604">
  <button id="go">Buka</button>
  <button id="mode" title="Ganti 1 / 2 halaman">2 halaman</button>
  <button id="full" title="Layar penuh (F)">Layar penuh</button>
  <div class="grow"></div>
  <div id="info"></div>
</div>

<main id="stage"><div class="book" id="book"></div></main>

<div class="bottom">
  <div class="cell"><button id="prev" class="nav" title="Sebelumnya (←)">‹ Sebelumnya</button></div>
  <div class="cell"><button id="random" title="Halaman acak (R / spasi)">Acak</button></div>
  <div class="cell"><button id="next" class="nav" title="Berikutnya (→)">Berikutnya ›</button></div>
  <div class="zoom">
    <button id="zout" title="Perkecil (-)">−</button>
    <span id="zval">100%</span>
    <button id="zin" title="Perbesar (+)">+</button>
  </div>
</div>

<script>
(function () {
  var TOTAL = 604;
  var BASE = "https://quran.tampang.com/wp-content/uploads/quran2/";

  var book = document.getElementById("book");
  var info = document.getElementById("info");
  var gotoEl = document.getElementById("goto");
  var zval = document.getElementById("zval");
  var modeBtn = document.getElementById("mode");

  var state = { page: 1, zoom: 1, single: false };

  function save() {
    try { localStorage.setItem("mushaf-acak", JSON.stringify(state)); } catch (e) {}
  }
  function load() {
    try {
      var s = JSON.parse(localStorage.getItem("mushaf-acak"));
      if (s && s.page >= 1 && s.page <= TOTAL) {
        state.page = s.page;
        state.zoom = Math.min(2.5, Math.max(0.5, s.zoom || 1));
        state.single = !!s.single;
      }
    } catch (e) {}
  }

  function clamp(p) { return Math.min(TOTAL, Math.max(1, p)); }
  // Genap di kiri, ganjil di kanan. Halaman 1 berdiri sendiri (s = 0).
  function spreadStart(p) { return p % 2 === 0 ? p : p - 1; }

  function makeSlot(n, side) {
    var d = document.createElement("div");
    d.className = "slot " + side;
    if (n < 1 || n > TOTAL) { d.classList.add("empty"); return d; }
    var loading = document.createElement("span");
    loading.className = "loading";
    loading.textContent = "Memuat halaman " + n + "…";
    d.appendChild(loading);
    var img = new Image();
    img.alt = "Mushaf halaman " + n;
    img.referrerPolicy = "no-referrer";
    img.onload = function () { d.innerHTML = ""; d.appendChild(img); };
    img.onerror = function () {
      d.innerHTML = "";
      var e = document.createElement("div");
      e.className = "err";
      e.textContent = "Gambar halaman " + n + " tidak bisa dimuat. Periksa koneksi internet, lalu coba lagi.";
      d.appendChild(e);
    };
    img.src = BASE + n + ".webp";
    return d;
  }

  function preload(n) {
    if (n < 1 || n > TOTAL) return;
    var i = new Image();
    i.referrerPolicy = "no-referrer";
    i.src = BASE + n + ".webp";
  }

  function render() {
    book.innerHTML = "";
    book.classList.toggle("single", state.single);
    var shown;
    if (state.single) {
      book.appendChild(makeSlot(state.page, "right"));
      shown = [state.page];
      preload(state.page + 1); preload(state.page - 1);
    } else {
      var s = spreadStart(state.page);
      book.appendChild(makeSlot(s, "left"));
      book.appendChild(makeSlot(s + 1, "right"));
      shown = [s, s + 1].filter(function (n) { return n >= 1 && n <= TOTAL; });
      preload(s + 2); preload(s + 3); preload(s - 2); preload(s - 1);
    }
    info.innerHTML = "Halaman <b>" + shown.join(" – ") + "</b> dari " + TOTAL;
    document.documentElement.style.setProperty("--zoom", state.zoom);
    zval.textContent = Math.round(state.zoom * 100) + "%";
    modeBtn.textContent = state.single ? "1 halaman" : "2 halaman";
    modeBtn.classList.toggle("on", state.single);
    document.title = "Mushaf Acak · hal. " + shown.join("–");
    document.getElementById("stage").scrollTo(0, 0);
    save();
  }

  function next() {
    state.page = state.single ? clamp(state.page + 1) : clamp(spreadStart(state.page) + 2);
    render();
  }
  function prev() {
    state.page = state.single ? clamp(state.page - 1) : clamp(spreadStart(state.page) - 2);
    render();
  }
  function random() { state.page = 1 + Math.floor(Math.random() * TOTAL); render(); }
  function goTo() {
    var n = parseInt(gotoEl.value, 10);
    if (isNaN(n)) return;
    state.page = clamp(n);
    gotoEl.value = "";
    render();
  }
  function zoom(delta) {
    state.zoom = Math.round(Math.min(2.5, Math.max(0.5, state.zoom + delta)) * 10) / 10;
    render();
  }
  function fullscreen() {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
  }

  document.getElementById("next").onclick = next;
  document.getElementById("prev").onclick = prev;
  document.getElementById("random").onclick = random;
  document.getElementById("go").onclick = goTo;
  document.getElementById("zin").onclick = function () { zoom(0.1); };
  document.getElementById("zout").onclick = function () { zoom(-0.1); };
  document.getElementById("full").onclick = fullscreen;
  modeBtn.onclick = function () { state.single = !state.single; render(); };
  gotoEl.addEventListener("keydown", function (e) { if (e.key === "Enter") goTo(); });

  document.addEventListener("keydown", function (e) {
    if (e.target === gotoEl) return;
    // Panah mengikuti posisi tombol: kiri = sebelumnya, kanan = berikutnya
    if (e.key === "ArrowLeft") prev();
    else if (e.key === "ArrowRight") next();
    else if (e.key === "r" || e.key === "R" || e.key === " ") { e.preventDefault(); random(); }
    else if (e.key === "+" || e.key === "=") zoom(0.1);
    else if (e.key === "-") zoom(-0.1);
    else if (e.key === "f" || e.key === "F") fullscreen();
  });

  load();
  var first = true;
  try { first = !localStorage.getItem("mushaf-acak"); } catch (e) {}
  if (first) { random(); } else { render(); }
})();
</script>
</body>
</html>
